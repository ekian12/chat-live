<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Chat en vivo para varias personas conectadas al mismo tiempo." />
  <title>Chat en vivo · Sala compartida</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="background" aria-hidden="true">
    <span class="blob blob--1"></span>
    <span class="blob blob--2"></span>
    <span class="blob blob--3"></span>
  </div>

  <!-- Acceso -->
  <div id="login" class="login">
    <form id="loginForm" class="login__card" autocomplete="off">
      <div class="login__logo" aria-hidden="true">💬</div>
      <h1>Únete al chat</h1>
      <p>Elige un nombre para hablar con las personas conectadas.</p>
      <label class="sr-only" for="nameInput">Tu nombre</label>
      <input id="nameInput" type="text" maxlength="24" placeholder="Tu nombre" required />
      <button class="login__submit" type="submit">Entrar al chat</button>
      <small>La sala es compartida: todos ven los mismos mensajes.</small>
    </form>
  </div>

  <main class="page">
    <section class="chat" aria-label="Chat en vivo">
      <header class="chat__header">
        <div class="agent">
          <div class="agent__avatar" aria-hidden="true">💬</div>
          <div class="agent__info">
            <h2 class="agent__name">Chat en vivo</h2>
            <p class="agent__status"><span class="dot"></span> <span id="countLabel">Conectando…</span></p>
          </div>
        </div>
        <div class="header__actions">
          <button id="themeBtn" class="icon-btn" type="button" title="Cambiar tema" aria-label="Cambiar tema">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8A9.02 9.02 0 0 0 12 3z"/></svg>
          </button>
          <button id="leaveBtn" class="icon-btn" type="button" title="Salir del chat" aria-label="Salir del chat">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5v3H3v4h7v3zm9-13h-6v2h6v12h-6v2h6a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/></svg>
          </button>
        </div>
      </header>

      <div id="onlineBar" class="online-bar" aria-label="Personas en línea"></div>

      <div id="messages" class="messages" role="log" aria-live="polite" aria-label="Mensajes del chat">
        <div class="welcome">
          <div class="welcome__icon" aria-hidden="true">👋</div>
          <h3>¡Bienvenido a la sala!</h3>
          <p>Los mensajes se comparten al instante con todas las personas conectadas.</p>
        </div>
      </div>

      <div id="typing" class="typing" hidden aria-live="polite">
        <span class="typing__dots"><span></span><span></span><span></span></span>
        <span id="typingText"></span>
      </div>

      <form id="chatForm" class="composer" autocomplete="off">
        <div class="composer__box">
          <button id="emojiBtn" class="icon-btn emoji-btn" type="button" title="Emojis" aria-label="Abrir emojis" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm-3.5-9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm7 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM12 17.5c2.3 0 4.3-1.4 5.1-3.5H6.9c.8 2.1 2.8 3.5 5.1 3.5z"/></svg>
          </button>
          <div id="emojiPanel" class="emoji-panel" hidden aria-label="Selector de emojis"></div>
          <textarea id="input" rows="1" maxlength="500" placeholder="Escribe un mensaje…" aria-label="Escribe un mensaje"></textarea>
          <span id="counter" class="counter" aria-live="polite"></span>
        </div>
        <button id="sendBtn" class="send-btn" type="submit" title="Enviar mensaje" aria-label="Enviar mensaje">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 20.4 17.2 12 3.4 3.6 3 5.6l9.3 6.4L3 18.4l.4 2zm13.8-9.2 3.3-2.1v5.8l-3.3-2.1v-1.6z"/></svg>
        </button>
      </form>

      <footer class="chat__footer">
        <span><span id="connectionDot" class="dot dot--gray"></span> <span id="statusLabel">Desconectado</span></span>
        <span id="meLabel"></span>
      </footer>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
